<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Work queues at a review bottleneck</title>
  <desc id="desc">Many work parcels crowd into a narrowing passage. A person inspects one at the review gate, while a single parcel emerges as value. The constriction, not individual effort, limits flow. Original vector artwork for Menguhan Bulut.</desc>
