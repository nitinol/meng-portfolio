    <path d="M81 231 L119 227 L123 262 L85 266 Z M133 240 L170 235 L174 271 L137 276 Z M192 228 L228 235 L222 270 L186 263 Z M239 256 L275 249 L281 284 L245 291 Z M85 294 L122 291 L125 328 L88 330 Z M142 290 L177 295 L172 332 L136 326 Z M198 291 L235 290 L235 327 L198 328 Z M272 299 L305 285 L318 312 L286 327 Z"/>
