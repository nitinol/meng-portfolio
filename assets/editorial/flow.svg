  </g>
  <g fill="#282824" font-family="Helvetica, Arial, sans-serif">
    <text x="56" y="69" font-size="32" font-weight="700">Watch the bottleneck</text>
    <text x="77" y="170" font-size="28">Work in</text><text x="364" y="118" font-size="28" fill="#0a66c2">Review</text>
    <text x="535" y="170" font-size="28">Value out</text>
    <text x="56" y="454" font-size="28">Busy is not the same as flowing.</text>
  </g>
</svg>
