  <g fill="#282824" font-family="Helvetica, Arial, sans-serif">
    <text x="56" y="69" font-size="32" font-weight="700">Deployed is not done</text>
    <text x="109" y="137" font-size="28">Shipped</text><text x="445" y="137" font-size="28" fill="#0a66c2">Learned?</text>
    <text x="56" y="454" font-size="28">Look. Listen. Learn.</text>
