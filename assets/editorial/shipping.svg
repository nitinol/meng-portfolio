  <title id="title">Deployed versus understood</title>
  <desc id="desc">A parcel with a release flag has shipped. Beside it, a person looks through a magnifying glass at an unlabelled analytical trace and asks what was learned. The trace is illustrative, not a metric or live service. Original vector artwork for Menguhan Bulut.</desc>
