        <div class="pl-pagehead pl-rv">
            <h1>Contact</h1>
            <p>Feel free to reach out about Product Manager / Product Owner roles.</p>
        </div>

        <!-- Contact Section -->
        <section id="contact" class="pl-section pl-contact pl-rv">
            <p><a href="mailto:menguhan@gmail.com">menguhan@gmail.com</a> · +90 555 258 65 68 · <a href="https://www.linkedin.com/in/menguhan">LinkedIn</a></p>

            <!-- Contact Form - Web3Forms -->
            <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
                <!-- Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="1860d79d-c004-425f-a8c9-3005bbc478bc">
                <input type="hidden" name="subject" value="New Portfolio Contact!">
                <input type="hidden" name="redirect" value="https://www.menguhan.com/success.html">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Name Lastname">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="jane@company.com">
                </div>
                <div class="form-group">
                    <label for="company">Company Name (Optional)</label>
                    <input type="text" id="company" name="company" placeholder="Tech Corp">
                </div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn Account (Optional)</label>
                    <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/jane-doe">
                </div>
                <div class="form-group">
                    <label for="message">Reason for Connecting</label>
                    <textarea id="message" name="message" rows="4" required
                        placeholder="Tell me about your product vision..."></textarea>
                </div>
                <div class="submit-wrapper" style="position: relative;">
                    <button type="submit" id="submitBtn" class="btn primary-btn full-width disabled">Send
                        Message</button>
                    <div id="formTooltip" class="validation-tooltip">Please fill all fields. Project details must be
                        min 41 chars.</div>
                </div>
            </form>
        </section>
